<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>README to PDF</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <h1 class="popup__title">README to PDF</h1>
        <p class="popup__subtitle">
          Export a GitHub README as a clean, printable PDF.
        </p>
      </header>

      <button id="export-button" class="button" type="button">
        Export README to PDF
      </button>

      <p id="status" class="status" role="status" aria-live="polite">
        Open a GitHub repository to get started.
      </p>

      <p class="popup__hint">
        A print preview opens in a new tab. In the dialog, set the destination
        to <strong>Save as PDF</strong>, then save.
      </p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
